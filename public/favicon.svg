<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Teng Li Works icon</title>
  <desc id="description">
    An architectural TL monogram with a terracotta accent.
  </desc>

  <style>
    .icon-background {
      fill: #f4f2ec;
      stroke: #d9d9d0;
    }

    .icon-mark {
      stroke: #35624f;
    }

    .icon-accent {
      fill: #c96745;
    }

    @media (prefers-color-scheme: dark) {
      .icon-background {
        fill: #1a1d1a;
        stroke: #343932;
      }

      .icon-mark {
        stroke: #8fc3a7;
      }

      .icon-accent {
        fill: #e28a67;
      }
    }
  </style>

  <rect
    class="icon-background"
    x="8"
    y="8"
    width="240"
    height="240"
    rx="56"
    stroke-width="8"
  />

  <g
    class="icon-mark"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M48 66h82" stroke-width="26" />
    <path d="M89 66v122" stroke-width="26" />
    <path d="M151 96v92h51" stroke-width="26" />
  </g>

  <circle class="icon-accent" cx="198" cy="65" r="12" />
</svg>
